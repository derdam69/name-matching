<div class="main-container">

  <div class="header">
      <input #searchQuery type="text"  class="search-input" placeholder="Search collection" spellcheck="false" (input)="onSearchUpdated(searchQuery.value)" />
  </div>

  <cdk-virtual-scroll-viewport id="scroll-viewport" class="sc"  itemSize="25"   minBufferPx="2000" maxBufferPx="4000">
    <div *cdkVirtualFor="let item of filteredIitems()" class="example-item list-item">
       <!-- {{item.Label}} -->
        <span class="toolbar-container">
            <div class="tools">
                <span class="open-folder" title="Open location" (click)="openLocation(item)">
                    <img alt="open location" class="folder-default" ngSrc="/assets/folder-mono.svg" height="20" width="20"/>
                    <img alt="open location" class="folder-hover" ngSrc="./assets/folder.svg" height="20" width="20"/>
                </span>
                <span class="open-folder" title="Play location" (click)="playLocation(item)">
                    <img alt="play location" class="folder-default" ngSrc="/assets/folder-play-mono.svg" height="20" width="20"/>
                    <img alt="play location" class="folder-hover" ngSrc="./assets/folder-play.svg" height="20" width="20"/>
                </span>
            </div>
        </span>
        {{item.Label}}
    </div>
  </cdk-virtual-scroll-viewport>
</div>
